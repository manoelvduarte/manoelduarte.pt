<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <!-- Dark Background -->
  <rect width="1200" height="630" fill="#080A0E" />
  
  <!-- Subtle Grid Pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E2430" stroke-width="1" stroke-opacity="0.5" />
    </pattern>
    <radialGradient id="limeGlow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#D4FF00" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#080A0E" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F3F4F6" />
      <stop offset="100%" stop-color="#D4FF00" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#grid)" />
  <circle cx="800" cy="200" r="450" fill="url(#limeGlow)" />

  <!-- Outer Frame -->
  <rect x="40" y="40" width="1120" height="550" rx="20" stroke="#1E2430" stroke-width="2" fill="none" />
  
  <!-- Brand Monogram -->
  <g transform="translate(100, 100)">
    <rect width="64" height="64" rx="16" fill="#0D1017" stroke="#1E2430" stroke-width="2" />
    <path d="M16 45V19H22.5L32 32.5L41.5 19H48V45H41.5V29.5L33.8 40.5H30.2L22.5 29.5V45H16Z" fill="#D4FF00" />
    <rect x="44" y="41" width="4" height="4" rx="1" fill="#00F0FF" />
  </g>

  <!-- Eyebrow Badge -->
  <g transform="translate(185, 115)">
    <rect width="420" height="34" rx="17" fill="#131722" stroke="#D4FF00" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="20" cy="17" r="4" fill="#D4FF00" />
    <text x="35" y="22" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#D4FF00" letter-spacing="2">PORTO, PORTUGAL // PRODUÇÃO WEB</text>
  </g>

  <!-- Big Typography -->
  <text x="100" y="270" font-family="'Space Grotesk', sans-serif" font-size="64" font-weight="700" fill="url(#textGrad)" letter-spacing="-1">
    MANOEL DUARTE
  </text>
  
  <text x="100" y="340" font-family="'Space Grotesk', sans-serif" font-size="34" font-weight="600" fill="#FFFFFF">
    Landing Pages, Websites &amp; Captação Digital
  </text>

  <text x="100" y="400" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="300" fill="#8A95A5">
    Páginas claras, rápidas e orientadas à conversão com WhatsApp direto.
  </text>

  <!-- Bottom Metric Badges -->
  <g transform="translate(100, 480)">
    <rect width="210" height="44" rx="8" fill="#0D1017" stroke="#1E2430" stroke-width="1" />
    <text x="20" y="27" font-family="'JetBrains Mono', monospace" font-size="12" fill="#D4FF00">⚡ 5 A 7 DIAS ÚTEIS</text>

    <rect x="230" width="230" height="44" rx="8" fill="#0D1017" stroke="#1E2430" stroke-width="1" />
    <text x="250" y="27" font-family="'JetBrains Mono', monospace" font-size="12" fill="#00F0FF">🛡️ 6 VIEWPORTS TESTADOS</text>

    <rect x="480" width="220" height="44" rx="8" fill="#0D1017" stroke="#1E2430" stroke-width="1" />
    <text x="500" y="27" font-family="'JetBrains Mono', monospace" font-size="12" fill="#10B981">💬 WHATSAPP DIRETO</text>
  </g>

  <!-- Website URL in the bottom-right -->
  <text x="1080" y="525" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="600" fill="#D4FF00">
    manoelduarte.pt
  </text>
</svg>
